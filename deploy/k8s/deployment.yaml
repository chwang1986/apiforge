# ApiForge Kubernetes Deployment
#
# Apply:
#   kubectl apply -f deploy/k8s/
#
# This creates:
#   - Namespace: apiforge
#   - Deployment: apiforge-api (2 replicas, resource limits)
#   - Service: apiforge-api (ClusterIP, port 8000)
#   - Ingress: apiforge (nginx, port 80)
#   - HPA: scale 2-10 replicas based on CPU

---
apiVersion: v1
kind: Namespace
metadata:
  name: apiforge
  labels:
    app.kubernetes.io/name: apiforge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiforge-api
  namespace: apiforge
  labels:
    app.kubernetes.io/name: apiforge
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: apiforge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apiforge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: apiforge-service:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: apiforge-api
  namespace: apiforge
  labels:
    app.kubernetes.io/name: apiforge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: apiforge
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apiforge
  namespace: apiforge
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: apiforge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apiforge-api
                port:
                  number: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apiforge-api
  namespace: apiforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apiforge-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
